## === USEPI bridge to external broker (added 2026-08-27) ===
## Восстановление: ~/.hermes/scripts/emqx_bridge_reapply.sh
## (docker exec -i emqx sh -c 'cat >> /opt/emqx/etc/emqx.conf' + conf reload --merge)
connectors.mqtt.ext_usepi {
  enable = true
  server = "79.174.94.236:1883"
  bridge_mode = false
  clean_start = true
  keepalive = "60s"
  retry_interval = "15s"
}

actions.mqtt.forward_usepi {
  enable = true
  connector = ext_usepi
  parameters {
    topic = "${topic}"
    qos = 1
    payload = "${payload}"
  }
  ## Буфер на время провалов внешнего канала: до 256 МБ, TTL 1 ч
  resource_opts {
    max_buffer_bytes = "256MB"
    request_ttl = "1h"
    inflight_window = 100
  }
}

rule_engine.rules.forward_usepi {
  enable = true
  sql = "SELECT * FROM \"USEPI/#\""
  actions = ["mqtt:forward_usepi"]
}
