version: '3.8'

services:
  signal-generator:
    build: .
    container_name: signal-generator
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
      # - SIGNAL_API_TOKEN=change-me   # раскомментируй для защиты мутаций API
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - iot-net

networks:
  iot-net:
    driver: bridge
